# PrediCitas CRP · backend por sí solo: PostgreSQL 16 + migraciones + API.
# Arranque, desde esta carpeta: docker compose up --build   →   http://localhost:8000/docs
# Los valores por defecto son SOLO para desarrollo local. Para cambiarlos, define las
# variables en un archivo .env junto a este compose (POSTGRES_PASSWORD, APP_DB_PASSWORD,
# SECRET_KEY, CORS_ORIGENES, IA_URL, DB_PUERTO_HOST).
name: predicitas-backend

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://predicitas_app:${APP_DB_PASSWORD:-predicitas_app_dev}@db:5432/predicitas
  DATABASE_URL_MIGRACIONES: postgresql+psycopg://predicitas_owner:${POSTGRES_PASSWORD:-predicitas_owner_dev}@db:5432/predicitas
  SECRET_KEY: ${SECRET_KEY:-solo-desarrollo-local-cambiar-esta-clave-0123456789}
  ENVIRONMENT: docker
  CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:5173,http://127.0.0.1:5173}
  # Servicio de inferencia (o su simulador) corriendo en el equipo anfitrión, puerto 8100.
  IA_URL: ${IA_URL:-http://host.docker.internal:8100}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: predicitas_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicitas_owner_dev}
      POSTGRES_DB: predicitas
      # Los usa db/init/01_rol_app.sh para crear el rol de la aplicación (D-015).
      APP_DB_USER: predicitas_app
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-predicitas_app_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PUERTO_HOST:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U predicitas_owner -d predicitas"]
      interval: 5s
      timeout: 5s
      retries: 10

  migraciones:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment: *backend-env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      migraciones:
        condition: service_completed_successfully
    ports:
      - "8000:8000"

volumes:
  pgdata:
